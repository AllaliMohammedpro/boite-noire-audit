apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-audit-monitoring-kube-prom-alertmanager
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-alertmanager
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: "webhook-test"
      routes:
        - match:
            severity: critical
          receiver: "webhook-test"
    receivers:
      - name: "webhook-test"
        webhook_configs:
          - url: "https://webhook.site/e7c61ba8-9a93-41ee-bd99-36e1fc5e5c85"
            send_resolved: true