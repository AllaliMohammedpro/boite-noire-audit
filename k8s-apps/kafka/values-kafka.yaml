image:
  registry: docker.io
  repository: apecloud/kafka
  tag: 3.7.1-debian-12-r11

kraft:
  enabled: true

controller:
  replicaCount: 1
  persistence:
    enabled: true
    size: 5Gi

broker:
  replicaCount: 0

listeners:
  client:
    protocol: PLAINTEXT

resourcesPreset: "small"

extraConfig: |
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1